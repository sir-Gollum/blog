baseURL = "http://mukomolov.com/"

# Change the default theme to be use when building the site with Hugo
theme = "LoveIt-0.3.0"

# website title
title = "Andrey Mukomolov"


# language code ["en", "zh-CN", "fr", "pl", ...]
languageCode = "en"
# language name ["English", "简体中文", "Français", "Polski", ...]
languageName = "EN"

defaultContentLanguage = "en"

[languages]
  [languages.en]
    weight = 1
    title = "Andrey Mukomolov"
    languageCode = "en"
    languageName = "EN"
    [[languages.en.menu.main]]
      weight = 1
      identifier = "blog"
      pre = ""
      post = ""
      name = "Blog"
      url = "/blog/"
      title = ""
    [[languages.en.menu.main]]
      weight = 2
      identifier = "tags"
      pre = ""
      post = ""
      name = "Tags"
      url = "/tags/"
      title = ""
    [languages.en.params]
      # Home page config
      [languages.en.params.home]
        # amount of RSS pages
        rss = 10
        # Home page profile
        [languages.en.params.list]
            # special amount of posts in each list page
            paginate = 20
            # date format (month and day)
            dateFormat = "Jan 2"
            # amount of RSS pages
            rss = 10

        [languages.en.params.home.profile]
          enable = true
          # Gravatar Email for preferred avatar in home page
          gravatarEmail = ""
          # URL of avatar shown in home page
          avatarURL = "/img/profile_c.jpg"
          # title shown in home page (HTML format is supported)
          title = ""
          # subtitle shown in home page (HTML format is supported)
          subtitle = '''
          <p>Welcome! I'm Andrey, a software engineer with over 17 years of experience, currently based in Munich, Germany.</p>

          <p>This website hosts my personal blog where I share my thoughts on programming, technology, and a number of other topics. </p>

          <p>The best way to reach me is via email.</p>
          '''
          # whether to use typeit animation for subtitle
          typeit = false
          # whether to show social links
          social = true
          # disclaimer (HTML format is supported)
          disclaimer = ""
          # Home page posts
        [languages.en.params.home.posts]
            enable = true
            # special amount of posts in each home posts page
            paginate = 6


        [languages.en.params.header.title]
            # URL of the LOGO
            # LOGO 的 URL
            # logo = ""
            # title name
            # 标题名称
            name = "Andrey Mukomolov"
            # you can add extra information before the name (HTML format is supported), such as icons
            # pre = "<i class='far fa-kiss-wink-heart fa-fw' aria-hidden='true'></i>"
            # you can add extra information after the name (HTML format is supported), such as icons
            # post = ""
            # whether to use typeit animation for title name
            typeit = false

    [languages.ru]
        weight = 2
        title = "Андрей Мукомолов"
        languageCode = "ru"
        languageName = "RU"
    [[languages.ru.menu.main]]
        weight = 1
        identifier = "blog"
        pre = ""
        post = ""
        name = "Блог"
        url = "/blog/"
        title = ""
    [[languages.ru.menu.main]]
        weight = 2
        identifier = "tags"
        pre = ""
        post = ""
        name = "Теги"
        url = "/tags/"
        title = ""

    [languages.ru.params]
        # Home page config
        [languages.ru.params.home]
        # amount of RSS pages
        rss = 10

        [languages.ru.params.list]
            # special amount of posts in each list page
            paginate = 20
            # date format (month and day)
            dateFormat = "Jan 2"
            # amount of RSS pages
            rss = 10


        # Home page profile
        [languages.ru.params.home.profile]
            enable = true
            # Gravatar Email for preferred avatar in home page
            gravatarEmail = ""
            # URL of avatar shown in home page
            avatarURL = "/img/profile_c.jpg"
            # title shown in home page (HTML format is supported)
            # title = "Андрей Мукомолов"
            # subtitle shown in home page (HTML format is supported)

            subtitle = '''
            <p>Привет, меня зовут Андрей.</p>

            <p>Я разработчик с 17 годами опыта промышленного программирования. В данный момент я живу в Мюнхене.</p>

            <p>На этом сайте я веду блог, в основном вокруг и около разных технологий, описываю свои проекты и прочие увлечения, и немного рассказываю о жизни.</p>

            <p>Если вы хотите связаться со мной, то проще всего это сделать по электронной почте.</p>
            '''

            # whether to use typeit animation for subtitle
            typeit = false
            # whether to show social links
            social = true
            # disclaimer (HTML format is supported)
            disclaimer = ""
            # Home page posts
            [languages.ru.params.home.posts]
                enable = true
                # special amount of posts in each home posts page
                paginate = 6


                # Header title config
                # 页面头部导航栏标题配置
            [languages.ru.params.header.title]
                # URL of the LOGO
                # LOGO 的 URL
                # logo = ""
                # title name
                # 标题名称
                name = "Андрей Мукомолов"
                # you can add extra information before the name (HTML format is supported), such as icons
                # pre = "<i class='far fa-kiss-wink-heart fa-fw' aria-hidden='true'></i>"
                # you can add extra information after the name (HTML format is supported), such as icons
                # post = ""
                # whether to use typeit animation for title name
                typeit = false

# Markup related configuration in Hugo
[markup]
  # Syntax Highlighting (https://gohugo.io/content-management/syntax-highlighting)
  [markup.highlight]
    # false is a necessary configuration (https://github.com/dillonzq/LoveIt/issues/158)
    noClasses = false

# Global image processing defaults used by Hugo's image pipeline
# (https://gohugo.io/content-management/image-processing/). Processed images are
# cached under resources/_gen and have their EXIF/GPS metadata stripped.
[imaging]
  # default JPEG/WebP quality (1-100) for resized images
  quality = 82
  # resampling filter: Lanczos gives the best quality for downscaling
  resampleFilter = "Lanczos"
  # anchor used when cropping (Fill/Crop)
  anchor = "Smart"


[outputs]
    home = ["HTML", "RSS"]
    section = ["HTML", "RSS"]
    taxonomy = ["HTML"]
    term = ["HTML", "RSS"]

[params]
    # site default theme ["auto", "light", "dark"]
    # 网站默认主题 ["auto", "light", "dark"]
    defaultTheme = "auto"
    dateFormat = "2006-01-02"
    title = "Andrey Mukomolov"
    description = "Andrey Mukomolov's personal website and blog"

[languages.en.params.author]
    name = "Andrey Mukomolov"
    email = "mukomolov@gmail.com"
    link = "https://mukomolov.com"

    # Header config
    # 页面头部导航栏配置
    [params.header]
      # desktop header mode ["fixed", "normal", "auto"]
      # 桌面端导航栏模式 ["fixed", "normal", "auto"]
      desktopMode = "fixed"
      # mobile header mode ["fixed", "normal", "auto"]
      # 移动端导航栏模式 ["fixed", "normal", "auto"]
      mobileMode = "auto"

[languages.ru.params.author]
    name = "Андрей Мукомолов"
    email = "mukomolov@gmail.com"
    link = "https://mukomolov.com"


# App icon config
# 应用图标配置
[params.app]
    # optional site title override for the app when added to an iOS home screen or Android launcher
    # 当添加到 iOS 主屏幕或者 Android 启动器时的标题, 覆盖默认标题
    title = "Andrey Mukomolov"
    # whether to omit favicon resource links
    # 是否隐藏网站图标资源链接
    noFavicon = false
    # modern SVG favicon to use in place of older style .png and .ico files
    # 更现代的 SVG 网站图标, 可替代旧的 .png 和 .ico 文件
    # TODO: this didn't work
    svgFavicon = "/favicon.svg"
    # Android browser theme color
    # Android 浏览器主题色
    themeColor = "#ffffff"
    # Safari mask icon color
    # Safari 图标颜色
    iconColor = "#5bbad5"
    # Windows v8-11 tile color
    # Windows v8-11 磁贴颜色
    tileColor = "#da532c"


[params.footer]
    hugo = false
    # site creation time
    # 网站创立年份
    since = 2012



[params.social]
    GitHub = "sir-Gollum"
    Linkedin = "mukomolov"
    Email = "mukomolov@gmail.com"
    RSS = "index.xml"



# Page global config
# 文章页面全局配置
[params.page]
    # whether to hide a page from home page
    # 是否在主页隐藏一篇文章
    hiddenFromHomePage = false
    # whether to hide a page from search results
    # 是否在搜索结果中隐藏一篇文章
    hiddenFromSearch = false
    # whether to enable twemoji
    # 是否使用 twemoji
    twemoji = false
    # whether to enable lightgallery
    # 是否使用 lightgallery
    lightgallery = true
    # gallery scope: false (default) groups every image on the page into one
    # global lightgallery carousel; true makes each {{< gallery >}} shortcode an
    # independent carousel. Overridable per page (front matter `galleryLocal`)
    # or per shortcode (`{{< gallery local="true" >}}`).
    galleryLocal = false
    # image optimization: true (default) resizes source photos into responsive,
    # format-converted variants (thumbnail / display / lightbox) via Hugo's
    # image pipeline instead of serving the originals. Applies to both
    # {{< gallery >}} images and plain Markdown images. Overridable per page
    # (front matter `imageOptimize`) or, for galleries, per shortcode
    # (`{{< gallery optimize="false" >}}`).
    imageOptimize = true
    # output format for optimized images ("webp", "jpg", "png", "auto"; "auto"
    # keeps the source format). WebP is smallest for photos.
    imageFormat = "webp"
    # target widths (px) for the generated variants; sources are never upscaled.
    imageThumbWidth = 500   # bottom thumbnail strip
    imageViewWidth = 1200   # inline / displayed image
    imageLargeWidth = 2400  # full-size opened in the lightbox
    # whether to enable the ruby extended syntax
    # 是否使用 ruby 扩展语法
    ruby = true
    # whether to enable the fraction extended syntax
    # 是否使用 fraction 扩展语法
    fraction = true
    # whether to enable the fontawesome extended syntax
    # 是否使用 fontawesome 扩展语法
    fontawesome = true
    # whether to show link to Raw Markdown content of the content
    # 是否显示原始 Markdown 文档内容的链接
    linkToMarkdown = true
    # whether to show the full text content in RSS
    # 是否在 RSS 中显示全文内容
    rssFullText = false
    # Table of the contents config
    # 目录配置
    [params.page.toc]
    # whether to enable the table of the contents
    # 是否使用目录
    enable = false
    # whether to keep the static table of the contents in front of the post
    # 是否保持使用文章前面的静态目录
    keepStatic = false
    # whether to make the table of the contents in the sidebar automatically collapsed
    # 是否使侧边目录自动折叠展开
    auto = true
    # Code config
    # 代码配置
    [params.page.code]
    # whether to show the copy button of the code block
    # 是否显示代码块的复制按钮
    copy = true
    # the maximum number of lines of displayed code by default
    # 默认展开显示的代码行数
    maxShownLines = 150
    # KaTeX mathematical formulas config (KaTeX https://katex.org/)
    # KaTeX 数学公式配置 (KaTeX https://katex.org/)
    [params.page.math]
    enable = false
    # default inline delimiter is $ ... $ and \( ... \)
    # 默认行内定界符是 $ ... $ 和 \( ... \)
    inlineLeftDelimiter = ""
    inlineRightDelimiter = ""
    # default block delimiter is $$ ... $$, \[ ... \], \begin{equation} ... \end{equation} and some other functions
    # 默认块定界符是 $$ ... $$, \[ ... \],  \begin{equation} ... \end{equation} 和一些其它的函数
    blockLeftDelimiter = ""
    blockRightDelimiter = ""
    # KaTeX extension copy_tex
    # KaTeX 插件 copy_tex
    copyTex = true
    # KaTeX extension mhchem
    # KaTeX 插件 mhchem
    mhchem = true
    # # Mapbox GL JS config (Mapbox GL JS https://docs.mapbox.com/mapbox-gl-js)
    # # Mapbox GL JS 配置 (Mapbox GL JS https://docs.mapbox.com/mapbox-gl-js)
    # [params.page.mapbox]
    # # access token of Mapbox GL JS
    # # Mapbox GL JS 的 access token
    # accessToken = "pk.eyJ1IjoiZGl
    # # style for the light theme
    # # 浅色主题的地图样式
    # lightStyle = "mapbox://styles/mapbox/light-v10?optimize=true"
    # # style for the dark theme
    # # 深色主题的地图样式
    # darkStyle = "mapbox://styles/mapbox/dark-v10?optimize=true"
    # # whether to add NavigationControl (https://docs.mapbox.com/mapbox-gl-js/api/#navigationcontrol)
    # # 是否添加 NavigationControl (https://docs.mapbox.com/mapbox-gl-js/api/#navigationcontrol)
    # navigation = true
    # # whether to add GeolocateControl (https://docs.mapbox.com/mapbox-gl-js/api/#geolocatecontrol)
    # # 是否添加 GeolocateControl (https://docs.mapbox.com/mapbox-gl-js/api/#geolocatecontrol)
    # geolocate = true
    # # whether to add ScaleControl (https://docs.mapbox.com/mapbox-gl-js/api/#scalecontrol)
    # # 是否添加 ScaleControl (https://docs.mapbox.com/mapbox-gl-js/api/#scalecontrol)
    # scale = true
    # # whether to add FullscreenControl (https://docs.mapbox.com/mapbox-gl-js/api/#fullscreencontrol)
    # # 是否添加 FullscreenControl (https://docs.mapbox.com/mapbox-gl-js/api/#fullscreencontrol)
    # fullscreen = true
    # Social share links in post page
    # 文章页面的分享信息设置
    [params.page.share]
        enable = true
        Twitter = true
        Facebook = true
        Linkedin = true
        Whatsapp = false
        Pinterest = false
        Tumblr = false
        HackerNews = true
        Reddit = false
        VK = false
        Buffer = false
        Xing = false
        Line = false
        Instapaper = false
        Pocket = false
        Flipboard = false
        Weibo = false
        Blogger = false
        Baidu = false
        Odnoklassniki = false
        Evernote = false
        Skype = false
        Trello = false
        Mix = false
    # Comment config
    # 评论系统设置
    [params.page.comment]
        enable = false

    # Third-party library config
    # 第三方库配置
    [params.page.library]
    [params.page.library.css]
        # someCSS = "some.css"
        # located in "assets/" 位于 "assets/"
        # Or 或者
        # someCSS = "https://cdn.example.com/some.css"
    [params.page.library.js]
        # someJavascript = "some.js"
        # located in "assets/" 位于 "assets/"
        # Or 或者
        # someJavascript = "https://cdn.example.com/some.js"
    # Page SEO config
    # 页面 SEO 配置
    [params.page.seo]
    # image URL
    # 图片 URL
    images = []
    # # Publisher info
    # # 出版者信息
    # [params.page.seo.publisher]
    #     name = "xxxx"
    #     logoUrl = "/images/avatar.png"


[caches]
    [caches.images]
    dir = ':cacheDir/images'
